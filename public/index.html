<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صندوق الردود</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1d2433;--mu:#6b7385;--pr:#2563eb;--bd:#e3e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--tx:#e8ecf4;--mu:#8d96ab;--bd:#2a3247}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:8px;padding:10px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;overflow-x:auto}
button,input,textarea{font:inherit;color:inherit}
.tab{padding:8px 14px;border:1px solid var(--bd);background:none;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:12px;max-width:960px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;margin:4px 0 10px}
.conv{display:flex;gap:10px;align-items:center;cursor:pointer}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff}
.fb{background:#1877f2}.ig{background:#d62976}.wa{background:#25d366}
.mu{color:var(--mu);font-size:13px}
.msgs{max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;white-space:pre-wrap}
.in{background:var(--bg);align-self:flex-start}.out{background:var(--pr);color:#fff;align-self:flex-end}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:right}
.tbl{overflow-x:auto}
label{font-size:14px;display:block}.chk{display:flex;gap:8px;align-items:center;margin-bottom:8px}.chk input{width:auto;margin:0}
select{width:100%;padding:8px;margin:4px 0 10px;background:var(--bg);color:inherit;border:1px solid var(--bd);border-radius:8px}
.kw select{width:auto;margin:0}
.lg-head{background:var(--card);border-bottom:1px solid var(--bd);padding:14px 20px}
.lg-logo{display:inline-block;color:#0ea5e9;line-height:1.15;font-size:13px;letter-spacing:1px}
.lg-logo b{display:block;background:#22b14c;color:#fff;padding:3px 10px;margin-top:2px;font-size:18px;letter-spacing:0}
.lg-card{background:var(--card);border-radius:6px;margin:48px auto;box-shadow:0 1px 4px #0002;width:calc(100% - 40px);max-width:520px}
.lg-title{padding:20px 24px;font-size:22px;border-bottom:1px solid var(--bd)}
.lg-body{padding:24px}.lg-body label{font-size:18px;display:block;margin-bottom:6px}
.lg-body input:not([type=checkbox]){padding:13px;font-size:17px;margin-bottom:22px}
.lg-btn{background:#42a5dc;padding:12px 44px;font-size:18px}
.lg-link{color:#2b9be3;display:block;margin-top:18px;text-decoration:none}
</style>
</head>
<body>
<div id="login" style="display:none;flex-direction:column;min-height:100vh">
  <div class="lg-head"><div class="lg-logo">INBOX SYSTEM<b>نظام الردود</b></div></div>
  <div class="lg-card" dir="ltr"><div class="lg-title">Login</div>
  <div class="lg-body">
    <label>E-Mail</label><input id="un" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
    <div class="chk" style="font-size:18px"><input type="checkbox" id="rm"><span>Remember Me</span></div>
    <button class="btn lg-btn" onclick="login()">Login</button>
    <a href="#" class="lg-link" onclick="alert('اطلب من المدير إعادة تعيين كلمة المرور من تبويب المشرفين. وللمدير الأساسي: غيّر ADMIN_PASSWORD من إعدادات Render.');return false">Forgot Your Password?</a>
  </div></div>
</div>
<div id="app" style="display:none">
<header>
  <button class="tab on" data-t="inbox">📥 الصندوق</button>
  <button class="tab" data-t="comments" data-p="inbox">💬 التعليقات</button>
  <button class="tab" data-t="users">👥 المستخدمون</button>
  <button class="tab" data-t="leads">📋 العملاء</button>
  <button class="tab" data-t="stats">📊 الإحصائيات</button>
  <button class="tab" data-t="subs">💳 الاشتراكات</button>
  <button class="tab" data-t="flow">🧩 المسارات</button>
  <button class="tab" data-t="broadcast">📢 البث</button>
  <button class="tab" data-t="harvest" data-p="broadcast">🎯 المعلّقون</button>
  <button class="tab" data-t="channels" data-p="settings">🔗 الربط</button>
  <button class="tab" data-t="settings">⚙️ الإعدادات</button>
  <button class="tab" data-t="admins">🔑 المشرفون</button>
  <button class="tab" onclick="logout()">خروج</button>
</header>
<main id="main"></main>
</div>
<script>
let RM=false;
const store=(k,v)=>{if(v===undefined)return localStorage.getItem(k)||sessionStorage.getItem(k);(RM?localStorage:sessionStorage).setItem(k,v)};
let T=store('t'),tab='inbox',cur=null;
const H=()=>({'x-token':T,'Content-Type':'application/json'});
const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:H()});if(r.status==401){logout();throw 0}return r.json()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CH={fb:'فيسبوك',ig:'انستغرام',wa:'واتساب'};
function logout(){sessionStorage.clear();localStorage.clear();T=null;show()}
async function login(){
  RM=rm.checked;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:un.value.trim(),password:pw.value})});
  if(!r.ok)return alert('بيانات الدخول غير صحيحة');
  const j=await r.json();T=j.token;store('t',T);store('p',JSON.stringify(j.perms));show();
}
const P=()=>{try{return JSON.parse(store('p'))||[]}catch(e){return[]}};
function show(){
  login_.style.display=T?'none':'flex';app.style.display=T?'block':'none';
  if(!T)return;
  const ok=P(),tabs=[...document.querySelectorAll('header .tab[data-t]')];
  tabs.forEach(b=>b.style.display=ok.includes(b.dataset.p||b.dataset.t)?'':'none');
  if(!ok.includes(tab=='harvest'?'broadcast':tab)){const f=tabs.find(b=>b.style.display!=='none');if(f)f.click();return}
  render()}
const login_=document.getElementById('login');
document.querySelectorAll('header .tab[data-t]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('header .tab[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;cur=null;render()});
function render(){({inbox,channels,comments,users,leads,stats,subs,flow,broadcast,harvest,admins,settings})[tab]()}

let _cv=[],CQ='';
function cvHtml(){
  const l=_cv.map((c,i)=>[c,i]).filter(([c])=>!CQ||((c.name||'')+' '+c.contact+' '+(c.text||'')).toLowerCase().includes(CQ));
  return l.length?l.map(([c,i])=>`<div class="card conv" onclick="openChatI(${i})">
    <span class="badge ${esc(c.channel)}">${CH[c.channel]||esc(c.channel)}</span>
    <div style="flex:1;min-width:0"><b>${esc(c.name||c.contact)}</b><div class="mu" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.dir=='out'?'↩ ':''}${esc(c.text)}</div></div>
    <span class="mu">${new Date(c.ts).toLocaleString('ar-IQ',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'})}</span></div>`).join(''):'<p class="mu">لا توجد محادثات</p>';
}
async function inbox(){
  if(cur)return chat();
  _cv=await api('/api/conversations');
  main.innerHTML=`<input id="cq" placeholder="🔍 بحث في المحادثات" value="${esc(CQ)}" oninput="CQ=this.value.toLowerCase();document.getElementById('cl').innerHTML=cvHtml()"><div id="cl">${cvHtml()}</div>`;
}
function openChatI(i){const c=_cv[i];if(c)openChat(c.channel,c.contact,c.name||c.contact)}
function openChat(channel,contact,name){cur={channel,contact,name};chat()}
async function chat(){
  const ms=await api(`/api/messages?channel=${cur.channel}&contact=${encodeURIComponent(cur.contact)}`);
  main.innerHTML=`<button class="tab" onclick="cur=null;render()">← رجوع</button>
  <div class="card" style="margin-top:10px"><b>${esc(cur.name)}</b> <span class="badge ${cur.channel}">${CH[cur.channel]}</span>
  <div class="msgs" id="ms" data-n="${ms.length}" style="margin-top:10px">${ms.map(m=>`<div class="m ${m.dir}">${esc(m.text)}</div>`).join('')}</div>
  <textarea id="tx" rows="2" placeholder="اكتب ردك..."></textarea><button class="btn" onclick="sendMsg()">إرسال</button> <button class="tab" onclick="resume()">▶️ إعادة تشغيل البوت لهذا الشخص</button></div>`;
  ms_.scrollTop=ms_.scrollHeight;
}
const ms_={get scrollTop(){return 0},set scrollTop(v){const e=document.getElementById('ms');if(e)e.scrollTop=v},get scrollHeight(){const e=document.getElementById('ms');return e?e.scrollHeight:0}};
async function refreshChat(){
  if(!cur)return;const e=document.getElementById('ms');if(!e)return;
  const ms=await api(`/api/messages?channel=${cur.channel}&contact=${encodeURIComponent(cur.contact)}`);
  if(String(ms.length)===e.dataset.n)return;
  e.dataset.n=ms.length;e.innerHTML=ms.map(m=>`<div class="m ${m.dir}">${esc(m.text)}</div>`).join('');e.scrollTop=e.scrollHeight}
async function sendMsg(){
  const text=document.getElementById('tx').value.trim();if(!text)return;
  await api('/api/send',{method:'POST',body:JSON.stringify({...cur,text})});chat();
}
async function resume(){await api('/api/resume',{method:'POST',body:JSON.stringify(cur)});alert('تم ✅')}
async function leads(){
  const ls=await api('/api/leads');
  const keys=[...new Set(ls.flatMap(l=>Object.keys(l.answers||{})))];
  main.innerHTML=`<div class="card"><a class="btn" style="text-decoration:none;display:inline-block" href="/api/export.xlsx?t=${T}">⬇️ تحميل Excel</a></div>
  <div class="card tbl"><table><tr><th>التاريخ</th><th>القناة</th><th>الاسم</th>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr>
  ${ls.map(l=>`<tr><td>${new Date(l.ts).toLocaleDateString('ar-IQ')}</td><td>${CH[l.channel]}</td><td>${esc(l.name)}</td>${keys.map(k=>`<td>${esc((l.answers||{})[k])}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='fb-done'&&tab==='channels')channels()});
async function channels(){
  const s=await api('/api/fb/status'),cp=t=>`<input readonly dir="ltr" value="${esc(t)}" onclick="this.select()">`;
  main.innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center"><span class="badge fb">فيسبوك</span><b style="flex:1">${s.connected?esc(s.name||'مربوط (عبر متغيرات Render)'):'غير مربوط'}</b>${s.connected?'<span>✅</span>':''}</div>
  ${s.igName?`<div class="mu" style="margin-top:6px"><span class="badge ig">انستغرام</span> @${esc(s.igName)}</div>`:''}
  ${s.appReady?`<div style="margin-top:12px"><button class="btn" onclick="fbConnect()">${s.connected?'🔄 إعادة الربط / تغيير الصفحة':'🔗 ربط صفحة فيسبوك'}</button> ${s.source=='db'?'<button class="tab" onclick="fbOff()">فصل</button>':''}</div>
  <p class="mu">ستفتح نافذة فيسبوك: سجّل الدخول ووافق على الصلاحيات واختر صفحتك. بعدها يفعّل النظام استقبال الرسائل والتعليقات تلقائياً.</p>`
  :`<p class="mu" style="margin-top:10px">لتفعيل زر الربط أضف في Render ← Environment المتغيرين <b>FB_APP_ID</b> و <b>FB_APP_SECRET</b> (من Meta ← App settings ← Basic) ثم أعد النشر.</p>`}</div>
  ${s.pending.length?`<div class="card"><b>اختر الصفحة التي تريد ربطها</b>${s.pending.map((p,i)=>`<div class="conv" style="margin-top:8px"><div style="flex:1"><b>${esc(p.name)}</b>${p.igName?`<div class="mu">انستغرام: @${esc(p.igName)}</div>`:''}</div><button class="btn" onclick="fbPick('${esc(p.id)}')">اختيار</button></div>`).join('')}</div>`:''}
  <div class="card"><b>إعدادات تضعها في Meta (مرة واحدة)</b>
  <label>Valid OAuth Redirect URI (Facebook Login ← Settings)</label>${cp(s.redirect)}
  <label>Webhook Callback URL</label>${cp(s.webhook)}
  <p class="mu">واتساب يُربط من متغيري WA_TOKEN و WA_PHONE_ID في Render.</p></div>`;
}
function fbConnect(){const w=open('/auth/facebook?t='+encodeURIComponent(T),'fbc','width=620,height=720');if(!w)location.href='/auth/facebook?t='+encodeURIComponent(T)}
async function fbPick(id){const r=await api('/api/fb/select',{method:'POST',body:JSON.stringify({id})});if(r.error)return alert(r.error);alert('تم الربط ✅');channels()}
async function fbOff(){if(confirm('فصل الصفحة؟ سيتوقف الرد التلقائي'))await api('/api/fb/disconnect',{method:'POST'}),channels()}
let CM={ch:'fb'},_cm=[];
const cmRows=()=>_cm.length?_cm.map((c,i)=>`<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="badge ${esc(c.channel)}">${CH[c.channel]||''}</span><b style="flex:1">${esc(c.name||c.user_id)}</b><span class="mu">${new Date(c.ts).toLocaleString('ar-IQ',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'})}</span></div>
  <p style="margin:8px 0;white-space:pre-wrap">${esc(c.text)}</p>
  <div class="mu" style="margin-bottom:6px">${c.liked?'❤️ أُعجب ':''}${c.replied?'↩️ رُدّ علناً ':''}${c.dm?'✉️ رسالة خاصة':''}</div>
  <input id="cr${i}" placeholder="اكتب ردك..." style="margin-bottom:6px">
  <div style="display:flex;gap:6px;flex-wrap:wrap">${c.channel=='fb'?`<button class="tab" onclick="cmAct(${i},'like')">❤️ إعجاب</button>`:''}<button class="btn" onclick="cmAct(${i},'reply')">↩️ رد علني</button><button class="tab" onclick="cmAct(${i},'dm')">✉️ رسالة خاصة</button></div></div>`).join(''):'<p class="mu">لا توجد تعليقات بعد. اضغط «تحديث من الصفحة» أو انتظر وصول تعليقات جديدة.</p>';
async function comments(){
  _cm=await api('/api/comments?channel='+CM.ch);
  main.innerHTML=`<div class="card"><select onchange="CM.ch=this.value;comments()"><option value="fb" ${CM.ch=='fb'?'selected':''}>فيسبوك</option><option value="ig" ${CM.ch=='ig'?'selected':''}>انستغرام</option></select>
  <button class="tab" onclick="cmSync()">🔄 تحديث من الصفحة</button><div class="mu">الرد والإعجاب يظهران باسم صفحتك.</div></div><div id="cml">${cmRows()}</div>`;
}
async function cmSync(){const r=await api('/api/comments/sync',{method:'POST',body:JSON.stringify({channel:CM.ch})});if(r.error)return alert(r.error);alert('أُضيف '+r.added+' تعليق');comments()}
async function cmAct(i,a){
  const c=_cm[i],body=a=='like'?{}:{text:document.getElementById('cr'+i).value.trim()};
  if(a!='like'&&!body.text)return alert('اكتب النص أولاً');
  const r=await api(`/api/comments/${c.id}/${a}`,{method:'POST',body:JSON.stringify(body)});
  if(r.error)return alert(r.error);comments();
}
let F=null,U={page:1,search:'',ch:''};
const MT=[['is','الرسالة تساوي'],['contains','تحتوي'],['word','تحتوي كلمة'],['starts','تبدأ بـ'],['resume','كلمة استئناف البوت'],['image','صورة'],['sticker','ملصق'],['audio','صوت']];
function addKw(){F=collect();F.keywords.push({match:'contains',word:'',node:''});flow()}
async function users(){
  const r=await api(`/api/users?page=${U.page}&channel=${U.ch}&search=${encodeURIComponent(U.search)}`);
  main.innerHTML=`<div class="card"><input id="us" placeholder="بحث بالاسم أو الرقم (Enter)" value="${esc(U.search)}" onkeydown="if(event.key=='Enter'){U.search=this.value;U.page=1;users()}">
  <select onchange="U.ch=this.value;U.page=1;users()"><option value="">كل القنوات</option>${Object.entries(CH).map(([v,t])=>`<option value="${v}" ${U.ch==v?'selected':''}>${t}</option>`).join('')}</select>
  <label>استيراد من CSV (أعمدة: name, phone وإن وُجد channel)</label><input type="file" id="uf" accept=".csv,.txt" onchange="impCsv(this)">
  <a class="tab" style="text-decoration:none;display:inline-block" href="/api/users.csv?t=${T}">⬇️ تصدير CSV</a></div>
  <div class="card tbl"><table><tr><th>الاسم</th><th>الرقم</th><th>القناة</th><th>آخر ظهور</th><th></th></tr>
  ${(_us=r.rows).map((u,i)=>`<tr><td>${esc(u.name)}</td><td dir="ltr">${esc(u.phone||u.contact)}</td><td>${CH[u.channel]}</td><td>${u.last_seen?new Date(u.last_seen).toLocaleDateString('ar-IQ'):'-'}</td><td><button class="tab" onclick="delU(${i})">🗑</button></td></tr>`).join('')}</table>
  <p class="mu">الإجمالي: ${r.total} — صفحة ${U.page}</p>
  <button class="tab" ${U.page<2?'disabled':''} onclick="U.page--;users()">السابق</button> <button class="tab" ${U.page*20>=r.total?'disabled':''} onclick="U.page++;users()">التالي</button></div>`;
}
let _us=[];
async function delU(i){const u=_us[i];if(!u||!confirm('حذف '+(u.name||u.contact)+'؟ (تُحذف محادثاته أيضاً)'))return;await api('/api/users/'+u.channel+'/'+encodeURIComponent(u.contact),{method:'DELETE'});users()}
function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x))rows.push(r);r=[]}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows}
async function impCsv(inp){
  const f=inp.files[0];if(!f)return;const rows=parseCSV(await f.text());if(!rows.length)return;
  const h=rows[0].map(x=>x.trim().toLowerCase());const hasH=h.includes('phone')||h.includes('name');
  const ix=n=>h.indexOf(n),ni=hasH?ix('name'):0,pi=hasH?ix('phone'):1,ci=hasH?ix('channel'):-1;
  const list=(hasH?rows.slice(1):rows).map(r=>({name:r[ni]||'',phone:r[pi]||'',channel:ci>=0?r[ci]:'wa'}));
  let n=0;for(let i=0;i<list.length;i+=1000){n+=(await api('/api/users/import',{method:'POST',body:JSON.stringify({users:list.slice(i,i+1000)})})).imported}
  alert('تم استيراد '+n+' مستخدم ✅');users();
}
async function broadcast(){
  const bs=await api('/api/broadcasts');
  main.innerHTML=`<div class="card"><label>اسم البث</label><input id="bn"><label>القناة</label><select id="bc" style="width:100%;padding:8px;margin:4px 0 10px"><option value="wa">واتساب</option><option value="fb">فيسبوك</option><option value="ig">انستغرام</option></select>
  <label>العقدة المرسلة (من المسارات)</label><input id="bd" placeholder="مثال: start">
  <label>قالب واتساب معتمد (اختياري — يسمح بالإرسال خارج 24 ساعة)</label><input id="bt" placeholder="اسم القالب"><input id="bl" value="ar" placeholder="رمز اللغة">
  <p class="mu">بدون قالب: يُرسل فقط لمن راسلك خلال آخر 24 ساعة. قوالب واتساب تُحسب بسعر لكل رسالة.</p>
  <button class="btn" onclick="sendB()">ابدأ البث</button></div>
  <div id="bl">${bcList(bs)}</div>`;
}
const bcList=bs=>bs.map(b=>`<div class="card"><b>${esc(b.name)}</b> <span class="badge ${b.channel}">${CH[b.channel]}</span><div class="mu">${esc(b.status)} — أُرسل ${b.sent} / ${b.total} — فشل ${b.failed}</div></div>`).join('')||'<p class="mu">لا توجد عمليات بث</p>';
async function refreshB(){const e=document.getElementById('bl');if(e)e.innerHTML=bcList(await api('/api/broadcasts'))}
async function sendB(){
  if(!confirm('بدء البث لكل المستخدمين المؤهلين؟'))return;
  const r=await api('/api/broadcast',{method:'POST',body:JSON.stringify({name:bn.value,channel:bc.value,node:bd.value.trim(),template:bt.value.trim(),lang:bl.value.trim()})});
  if(r.error)return alert(r.error);bn.value='';broadcast();
}
let HV={ch:'fb',posts:[],post:''};
async function harvest(){
  main.innerHTML=`<div class="card"><label>القناة</label><select id="hc" onchange="HV.ch=this.value;HV.posts=[];HV.post='';harvest()"><option value="fb" ${HV.ch=='fb'?'selected':''}>فيسبوك</option><option value="ig" ${HV.ch=='ig'?'selected':''}>انستغرام</option></select>
  <button class="tab" onclick="loadPosts()">تحميل منشورات الصفحة</button>
  <select id="hp" onchange="HV.post=this.value;harvest()"><option value="">اختر منشوراً</option>${HV.posts.map(p=>`<option value="${p.id}" ${HV.post==p.id?'selected':''}>${esc(p.text||p.id)} — ${new Date(p.ts).toLocaleDateString('ar-IQ')}</option>`).join('')}</select>
  <button class="btn" onclick="doHarvest()">استخراج المعلّقين</button></div><div id="hr"></div>`;
  if(HV.post)showH();
}
async function loadPosts(){const r=await api('/api/posts?channel='+HV.ch);if(r.error)return alert(r.error);HV.posts=r;harvest()}
async function doHarvest(){if(!HV.post)return alert('اختر منشوراً');const r=await api('/api/harvest',{method:'POST',body:JSON.stringify({channel:HV.ch,postId:HV.post})});if(r.error)return alert(r.error);alert('تم استخراج '+r.collected+' تعليق');harvest()}
async function showH(){
  const rows=await api(`/api/harvest?channel=${HV.ch}&postId=${encodeURIComponent(HV.post)}`);
  hr.innerHTML=`<div class="card"><b>المعلّقون: ${rows.length}</b> — لم يُرسَل لهم: ${rows.filter(r=>!r.sent).length}
  <a class="tab" style="text-decoration:none;display:inline-block" href="/api/harvest.csv?channel=${HV.ch}&postId=${encodeURIComponent(HV.post)}&t=${T}">⬇️ CSV</a>
  <label>رد خاص على المعلّقين (رقم العقدة من المسارات)</label><input id="hn" value="start">
  <div class="mu">يُرسل رسالة خاصة واحدة لكل تعليق عمره أقل من 7 أيام، وهو الحد الذي تسمح به Meta.</div><button class="btn" onclick="sendH()">إرسال</button></div>
  <div class="card tbl"><table><tr><th>الاسم</th><th>المعرّف</th><th>التعليق</th><th>أُرسل</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td dir="ltr">${esc(r.user_id)}</td><td>${esc(r.text)}</td><td>${r.sent?'✅':'-'}</td></tr>`).join('')}</table></div>`;
}
async function sendH(){if(!confirm('إرسال رد خاص لكل المعلّقين الذين لم يصلهم؟'))return;const r=await api('/api/harvest/send',{method:'POST',body:JSON.stringify({channel:HV.ch,postId:HV.post,node:hn.value.trim()})});if(r.error)return alert(r.error);alert('قيد الإرسال: '+r.queued+' رسالة');setTimeout(showH,5000)}
const PL=[['inbox','الصندوق'],['users','المستخدمون'],['leads','العملاء'],['stats','الإحصائيات'],['subs','الاشتراكات'],['flow','المسارات'],['broadcast','البث'],['settings','الإعدادات'],['admins','المشرفون']];
let _adm=[];
async function admins(){
  _adm=await api('/api/admins');
  main.innerHTML=`<div class="card"><label>اسم المستخدم / الإيميل</label><input id="an"><label>كلمة المرور (اتركها فارغة إذا تعدّل الصلاحيات فقط)</label><input id="apw" type="password">
  <label>الدور</label><select id="ar" onchange="document.getElementById('pl').style.display=this.value=='owner'?'none':'block'"><option value="agent">موظف (صلاحيات مخصصة)</option><option value="owner">مدير (كل الصلاحيات)</option></select>
  <div id="pl">${PL.map(([v,t])=>`<div class="chk"><input type="checkbox" class="pc" value="${v}" ${['inbox','users','leads'].includes(v)?'checked':''}><span>${t}</span></div>`).join('')}</div>
  <button class="btn" onclick="addA()">حفظ</button></div>
  ${_adm.map((x,i)=>`<div class="card conv"><div style="flex:1"><b>${esc(x.username)}</b><div class="mu">${x.role=='owner'?'مدير — كل الصلاحيات':x.perms.map(p=>(PL.find(q=>q[0]==p)||[0,p])[1]).join('، ')||'بدون صلاحيات'}</div></div><button class="tab" onclick="editA(${i})">✏️</button><button class="tab" onclick="delA(${i})">🗑</button></div>`).join('')}
  <p class="mu">المدير الأساسي: admin + ADMIN_PASSWORD (لا يظهر هنا).</p>`;
}
function editA(i){const x=_adm[i];an.value=x.username;ar.value=x.role;document.getElementById('pl').style.display=x.role=='owner'?'none':'block';document.querySelectorAll('.pc').forEach(c=>c.checked=x.perms.includes(c.value));scrollTo(0,0)}
async function addA(){const r=await api('/api/admins',{method:'POST',body:JSON.stringify({username:an.value.trim(),password:apw.value,role:ar.value,perms:[...document.querySelectorAll('.pc:checked')].map(c=>c.value)})});if(r.error)return alert(r.error);admins()}
async function stats(){
  const s=await api('/api/stats');
  const card=(n,l)=>`<div class="card" style="flex:1;min-width:140px;text-align:center"><div style="font-size:26px;font-weight:700">${n}</div><div class="mu">${l}</div></div>`;
  const row=c=>`<div style="display:flex;flex-wrap:wrap;gap:8px">${c.join('')}</div>`;
  const bars=(title,rows,keys,cols)=>{const mx=Math.max(1,...rows.map(r=>keys.reduce((a,k)=>a+r[k],0)));
    return `<div class="card"><b>${title}</b><div style="display:flex;gap:3px;height:110px;margin-top:10px">${rows.map(r=>`<div title="${r.day}: ${keys.map(k=>r[k]).join(' / ')}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end">${keys.map((k,i)=>`<div style="height:${r[k]/mx*100}%;background:${cols[i]};min-height:${r[k]?2:0}px"></div>`).join('')}</div>`).join('')}</div>
    <div class="mu" style="display:flex;justify-content:space-between"><span>${rows[0].day.slice(5)}</span><span>${rows[rows.length-1].day.slice(5)}</span></div></div>`};
  main.innerHTML=row([card(s.users.total,'إجمالي المستخدمين'),card(s.users.d1,'نشط خلال 24 ساعة'),card(s.users.d7,'نشط خلال 7 أيام'),card(s.users.d30,'نشط خلال 30 يوم')])
  +row([card(s.leads,'عملاء مسجّلون'),card(s.subs.active,'اشتراكات فعّالة'),card(s.subs.expiring,'تنتهي خلال 7 أيام'),card(s.subs.expired,'اشتراكات منتهية')])
  +row([card(Number(s.revenue.month).toLocaleString(),'إيراد هذا الشهر'),card(Number(s.revenue.total).toLocaleString(),'إجمالي الإيراد'),card(s.broadcasts.sent,'رسائل بث مُرسلة')])
  +bars('الرسائل — آخر 14 يوم (أزرق: واردة، أخضر: صادرة)',s.messages,['inn','out'],['#2563eb','#25d366'])
  +bars('مستخدمون جدد',s.newUsers,['n'],['#d62976'])+bars('عملاء مسجّلون جدد',s.leadsPerDay,['n'],['#f59e0b'])
  +`<div class="card"><b>المستخدمون حسب القناة</b>${s.byChannel.map(c=>`<div class="conv" style="margin-top:8px"><span class="badge ${c.channel}">${CH[c.channel]}</span><b>${c.n}</b></div>`).join('')||'<p class="mu">لا بيانات</p>'}</div>`;
}
let SB={f:'all',s:''},_pl=[];
async function subs(){
  const [pl,rows]=await Promise.all([api('/api/plans'),api(`/api/subs?filter=${SB.f}&search=${encodeURIComponent(SB.s)}`)]);_pl=pl;
  const ST={active:['فعّال','#16a34a'],expiring:['ينتهي قريباً','#f59e0b'],expired:['منتهي','#dc2626'],cancelled:['ملغى','#6b7385']};
  main.innerHTML=`<div class="card"><b>الباقات</b>
  ${pl.map(p=>`<div class="conv" style="margin:8px 0"><div style="flex:1">${esc(p.name)} <span class="mu">— ${Number(p.price).toLocaleString()} / ${p.days} يوم</span></div><button class="tab" onclick="editPlan(${p.id})">✏️</button><button class="tab" onclick="delPlan(${p.id})">🗑</button></div>`).join('')||'<p class="mu">لا باقات بعد</p>'}
  <input type="hidden" id="pid"><label>اسم الباقة</label><input id="pn"><label>السعر</label><input id="pp" type="number" value="0"><label>المدة بالأيام</label><input id="pd" type="number" value="30">
  <button class="btn" onclick="savePlan()">حفظ الباقة</button></div>
  <div class="card"><b>إضافة / تجديد اشتراك</b><label>رقم الهاتف (أو معرّف المستخدم)</label><input id="sp" dir="ltr" placeholder="9647xxxxxxxxx"><label>الاسم (اختياري)</label><input id="sn">
  <label>القناة</label><select id="sc"><option value="wa">واتساب</option><option value="fb">فيسبوك</option><option value="ig">انستغرام</option></select>
  <label>الباقة</label><select id="spl">${pl.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
  <button class="btn" onclick="addSub()">اشتراك</button> <div class="mu">إذا عنده اشتراك فعّال يُمدَّد من تاريخ انتهائه.</div></div>
  <div class="card"><select id="sf" onchange="SB.f=this.value;subs()">${[['all','الكل'],['active','فعّال'],['expiring','ينتهي خلال 7 أيام'],['expired','منتهي'],['cancelled','ملغى']].map(([v,t])=>`<option value="${v}" ${SB.f==v?'selected':''}>${t}</option>`).join('')}</select>
  <input placeholder="بحث بالاسم أو الرقم (Enter)" value="${esc(SB.s)}" onkeydown="if(event.key=='Enter'){SB.s=this.value;subs()}">
  <div class="tbl"><table><tr><th>المشترك</th><th>الباقة</th><th>ينتهي</th><th>الحالة</th><th></th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.name)}<div class="mu" dir="ltr">${esc(r.contact)}</div></td><td>${esc(r.plan_name)}</td><td>${new Date(r.end_at).toLocaleDateString('ar-IQ')}</td><td><span class="badge" style="background:${ST[r.st][1]}">${ST[r.st][0]}</span></td><td>${r.st!='cancelled'?`<button class="tab" onclick="cancelSub(${r.id})">إلغاء</button>`:''}</td></tr>`).join('')}</table></div></div>`;
}
async function savePlan(){const r=await api('/api/plans',{method:'POST',body:JSON.stringify({id:pid.value||undefined,name:pn.value.trim(),price:pp.value,days:pd.value})});if(r.error)return alert(r.error);subs()}
function editPlan(id){const p=_pl.find(x=>x.id==id);pid.value=p.id;pn.value=p.name;pp.value=p.price;pd.value=p.days;pn.focus()}
async function delPlan(id){if(confirm('حذف الباقة؟ (الاشتراكات الحالية تبقى)')){await api('/api/plans/'+id,{method:'DELETE'});subs()}}
async function addSub(){const r=await api('/api/subs',{method:'POST',body:JSON.stringify({phone:sp.value.trim(),name:sn.value.trim(),channel:sc.value,planId:spl.value})});if(r.error)return alert(r.error);alert('ينتهي الاشتراك: '+new Date(r.end).toLocaleDateString('ar-IQ'));subs()}
async function cancelSub(id){if(confirm('إلغاء الاشتراك؟')){await api('/api/subs/'+id+'/cancel',{method:'POST'});subs()}}
async function delA(i){const u=_adm[i].username;if(confirm('حذف '+u+'؟')){await api('/api/admins/'+encodeURIComponent(u),{method:'DELETE'});admins()}}
async function flow(){
  if(!F)F=await api('/api/flow');
  const bt=n=>(n.buttons||[]).map(b=>`${b.title} => ${b.url||b.to}`).join('\n');
  main.innerHTML=`<div class="card"><label>العقدة الأولى (البداية)</label><input id="fs" value="${esc(F.start)}">
  <label>الرد الافتراضي (عقدة تُرسل إذا ما تطابقت أي كلمة)</label><input id="ff" value="${esc(F.fallback||'')}">
  <label>الكلمات المفتاحية</label>
  ${(F.keywords||[]).map(k=>`<div class="kw" style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px"><select class="km" style="padding:8px">${MT.map(([v,t])=>`<option value="${v}" ${(k.match||'contains')==v?'selected':''}>${t}</option>`).join('')}</select><input class="kw_w" placeholder="كلمات بفاصلة" value="${esc(k.word)}" style="flex:2;margin:0"><input class="kw_n" placeholder="العقدة" value="${esc(k.node)}" style="flex:1;margin:0"><button class="tab" onclick="this.parentNode.remove()">✕</button></div>`).join('')}
  <button class="tab" onclick="addKw()">➕ كلمة</button></div>
  ${Object.entries(F.nodes).map(([id,n])=>`<div class="card node" data-id="${esc(id)}">
  <b>${esc(id)}</b> <button class="tab" style="float:left" onclick="delNode('${esc(id)}')">🗑</button>
  <label>النوع</label><select class="ft" style="width:100%;padding:8px;margin:4px 0 10px">
   ${[['msg','رسالة'],['ask','سؤال (يحفظ الجواب)'],['end','نهاية + حفظ العميل'],['handoff','تحويل لموظف (إيقاف البوت)']].map(([v,t])=>`<option value="${v}" ${n.type==v?'selected':''}>${t}</option>`).join('')}</select>
  <label>النص ({name} = اسم الشخص)</label><textarea class="fx" rows="3">${esc(n.text)}</textarea>
  <label>رابط صورة (اختياري)</label><input class="fi" value="${esc(n.image)}">
  <label>اسم الحقل (للأسئلة)</label><input class="fy" value="${esc(n.key)}">
  <label>الخطوة التالية (رقم العقدة)</label><input class="fn" value="${esc(n.next)}">
  <label>أزرار (سطر لكل زر: العنوان => رقم_العقدة أو رابط)</label><textarea class="fb" rows="3">${esc(bt(n))}</textarea></div>`).join('')}
  <button class="tab" onclick="addNode()">➕ عقدة جديدة</button> <button class="btn" onclick="saveF()">حفظ المسارات</button>`;
}
function collect(){
  const nodes={};
  document.querySelectorAll('.node').forEach(d=>{
    const g=c=>d.querySelector(c).value.trim();
    nodes[d.dataset.id]={type:g('.ft'),text:d.querySelector('.fx').value,image:g('.fi'),key:g('.fy'),next:g('.fn'),
      buttons:g('.fb').split('\n').map(l=>l.split('=>').map(x=>x.trim())).filter(p=>p[0]&&p[1]).map(([title,t])=>/^https?:/.test(t)?{title,url:t}:{title,to:t})};
  });
  return {start:fs.value.trim(),nodes,fallback:ff.value.trim(),keywords:[...document.querySelectorAll('.kw')].map(d=>({match:d.querySelector('.km').value,word:d.querySelector('.kw_w').value.trim(),node:d.querySelector('.kw_n').value.trim()})).filter(k=>k.word||['image','sticker','audio'].includes(k.match))};
}
function addNode(){F=collect();const id=prompt('رقم/اسم العقدة (انكليزي بدون مسافات)');if(!id||F.nodes[id])return;F.nodes[id]={type:'msg',text:'',buttons:[]};flow()}
function delNode(id){if(!confirm('حذف '+id+'؟'))return;F=collect();delete F.nodes[id];flow()}
async function saveF(){F=collect();await api('/api/flow',{method:'PUT',body:JSON.stringify(F)});alert('تم الحفظ ✅')}
async function settings(){
  const s=await api('/api/settings');
  main.innerHTML=`<div class="card">
  <label>رد التعليق العلني</label><input id="cr" value="${esc(s.commentReply)}">
  <label>رقم واتساب لاستلام الطلبات (بصيغة دولية بدون +)</label><input id="nw" value="${esc(s.notifyWhatsApp)}" placeholder="9647xxxxxxxxx">
  <div class="chk"><input type="checkbox" id="al" ${s.autoLike?'checked':''}><span>إعجاب تلقائي بالتعليق (فيسبوك)</span></div>
  <div class="chk"><input type="checkbox" id="ap" ${s.autoPublicReply?'checked':''}><span>رد علني على التعليق</span></div>
  <div class="chk"><input type="checkbox" id="av" ${s.autoPrivateReply?'checked':''}><span>رسالة خاصة للمعلّق</span></div>
  <button class="btn" onclick="saveS()">حفظ</button></div>`;
}
async function saveS(){
  await api('/api/settings',{method:'PUT',body:JSON.stringify({commentReply:cr.value,notifyWhatsApp:nw.value.trim(),autoLike:al.checked,autoPublicReply:ap.checked,autoPrivateReply:av.checked})});
  alert('تم الحفظ ✅');
}
setInterval(async()=>{
  if(!T||document.hidden)return;
  const typing=document.activeElement&&document.activeElement.matches('input,textarea,select');
  if(tab==='inbox'){cur?refreshChat():(!typing&&inbox())}
  else if(tab==='comments'&&!typing){_cm=await api('/api/comments?channel='+CM.ch);const e=document.getElementById('cml');if(e)e.innerHTML=cmRows()}
  else if(tab==='broadcast')refreshB();
},8000);
show();
</script>
